services:
  - type: web
    name: hefestus-financeiro
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev --ignore-scripts
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
